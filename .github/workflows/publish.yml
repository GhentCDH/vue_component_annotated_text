name: Publish

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/use-cache

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: npx nx build core --production && npx nx build w3c-utils && npx nx build markdown

      - name: Publish package on NPM
        run: |
          # 1. Clean the existing workspace config context to prevent inline smashing
          # We add clear carriage breaks before injecting the new public registry definitions
          echo "" >> .npmrc
          echo "registry=https://npmjs.org" >> .npmrc
          echo "@ghentcdh:registry=https://npmjs.org" >> .npmrc
          echo "provenance=true" >> .npmrc
          
          # 2. Run the Nx release command passing the explicit OIDC providers as runtime flags
          # This protects standard npm metadata operations from failing with "unknown config" errors
          npx nx release publish --access public --verbose --tag latest
          
          # 3. Explicitly force the current version as 'latest' on the npm registry via OIDC
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            CLEAN_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
            echo "Enforcing version $CLEAN_VERSION as 'latest' across monorepo packages..."
          
            pnpm npm dist-tag add @ghentcdh/core@$CLEAN_VERSION latest
            pnpm npm dist-tag add @ghentcdh/w3c-utils@$CLEAN_VERSION latest
            pnpm npm dist-tag add @ghentcdh/markdown@$CLEAN_VERSION latest
          else
            echo "Workflow run manually via workflow_dispatch. Skipping manual dist-tag enforcement."
          fi
        shell: bash
        env:
          # This native environment parameter is correctly interpreted by pnpm/npm during the process
          NPM_CONFIG_OIDC_TOKEN_PROVIDER: github

      - name: Create GitHub Release
        # Only creates a GitHub release if triggered by an official version push tag
        if: github.ref_type == 'tag'
        run: gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
